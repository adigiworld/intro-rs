[package]
name = "tutor-web-app-ssr"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.2.1"
actix-files="0.6.2"
actix-rt = "2.2.0"
tera = "1.17.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
awc = "3.0.1"
sqlx = {version = "0.6.2", default-features = false, features = ["postgres","runtime-tokio-native-tls", "macros", "chrono"]}
rust-argon2 = "1.0.0"

#Environment variable access libraries
dotenv = "0.15.0"

[dev-dependencies]
actix-rt = "2.7.0"


[[bin]]
name="iter1"
path="src/bin/iter1.rs"


[[bin]]
name="iter2"
path="src/bin/iter2.rs"

[[bin]]
name="iter3"
path="src/bin/iter3.rs"

[[bin]]
name="iter4"
path="src/bin/iter4.rs"

[[bin]]
name="iter5-ssr"
path="src/bin/iter5-ssr.rs"




