[package]
name = "tutor-nodb"
version = "0.1.0"
edition = "2024"

default-run="tutor-service"

[dependencies]
actix-web = "4.2"
actix-rt = "2.7"
serde = { version = "1", features = ["derive"] }
chrono = {version = "0.4", features = ["serde"]}

[[bin]]
name = "basic-server"
path="src/bin/basic-server.rs"

[[bin]]
name = "tutor-service"
path="src/bin/tutor-service.rs"

